{% extends "base.html" %}
{% block title %}Add Destination – Admin Panel{% endblock %}

{% block content %}
<div class="bg-navy text-white py-4 mb-4">
  <div class="container">
    <h2 class="fw-bold font-serif mb-1">Add Tourist Attraction</h2>
    <p class="text-white-50 small mb-0">Create a new global landmark, historical monument, or national park listing</p>
  </div>
</div>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mb-4">
        
        <form method="POST" action="{{ url_for('admin.create_destination') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <h5 class="fw-bold text-navy font-serif mb-3">Attraction Details</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label class="form-label small fw-semibold text-dark">Destination Name</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Colosseum of Rome" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Category</label>
              <select name="category_id" class="form-select">
                {% for c in categories %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">City</label>
              <input type="text" name="city" class="form-control" placeholder="Rome" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">State / Region</label>
              <input type="text" name="state" class="form-control" placeholder="Lazio">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Country</label>
              <input type="text" name="country" class="form-control" placeholder="Italy" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Full Address</label>
              <input type="text" name="address" class="form-control" placeholder="Piazza del Colosseo, 1, 00184 Roma RM, Italy">
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Detailed Description</label>
              <textarea name="description" class="form-control" rows="4" placeholder="Historical context, architectural highlights, visitor guidelines..." required></textarea>
            </div>
          </div>

          <h5 class="fw-bold text-navy font-serif mb-3">Ticketing &amp; Quotas</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Base Ticket Price (₹)</label>
              <input type="number" name="ticket_price" class="form-control" value="1800" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Daily Visitor Capacity</label>
              <input type="number" name="capacity" class="form-control" value="2500" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Operating Hours</label>
              <input type="text" name="opening_hours" class="form-control" value="08:30 – 19:00" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Images (JSON Array or Image URL)</label>
              <input type="text" name="images" class="form-control" value='["https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=80"]'>
            </div>
          </div>

          <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="isFeatured" name="is_featured">
            <label class="form-check-label small fw-semibold text-dark" for="isFeatured">Feature this landmark on the homepage hero grid</label>
          </div>

          <div class="d-flex justify-content-end gap-3 pt-3 border-top">
            <a href="{{ url_for('admin.destinations') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-teal rounded-pill px-5 fw-semibold shadow-sm">
              Save &amp; Publish Destination
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
