{% extends "base.html" %}
{% block title %}Edit {{ destination.name }} – Admin Panel{% endblock %}

{% block content %}
<div class="bg-navy text-white py-4 mb-4">
  <div class="container">
    <h2 class="fw-bold font-serif mb-1">Edit Destination: {{ destination.name }}</h2>
    <p class="text-white-50 small mb-0">Update pricing, operational timings, and attraction quotas</p>
  </div>
</div>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mb-4">
        
        <form method="POST" action="{{ url_for('admin.edit_destination', id=destination.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <h5 class="fw-bold text-navy font-serif mb-3">Attraction Details</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label class="form-label small fw-semibold text-dark">Destination Name</label>
              <input type="text" name="name" class="form-control" value="{{ destination.name }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Category</label>
              <select name="category_id" class="form-select">
                {% for c in categories %}
                  <option value="{{ c.id }}" {% if destination.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">City</label>
              <input type="text" name="city" class="form-control" value="{{ destination.city }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">State / Region</label>
              <input type="text" name="state" class="form-control" value="{{ destination.state }}">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Country</label>
              <input type="text" name="country" class="form-control" value="{{ destination.country }}" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Full Address</label>
              <input type="text" name="address" class="form-control" value="{{ destination.address }}">
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Description</label>
              <textarea name="description" class="form-control" rows="4" required>{{ destination.description }}</textarea>
            </div>
          </div>

          <h5 class="fw-bold text-navy font-serif mb-3">Ticketing &amp; Quotas</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Base Ticket Price (₹)</label>
              <input type="number" name="ticket_price" class="form-control" value="{{ destination.ticket_price }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Daily Visitor Capacity</label>
              <input type="number" name="capacity" class="form-control" value="{{ destination.capacity }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Operating Hours</label>
              <input type="text" name="opening_hours" class="form-control" value="{{ destination.opening_hours }}" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Images (JSON Array or Image URL)</label>
              <input type="text" name="images" class="form-control" value="{{ destination.images }}">
            </div>
          </div>

          <div class="d-flex gap-4 mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="isFeatured" name="is_featured" {% if destination.is_featured %}checked{% endif %}>
              <label class="form-check-label small fw-semibold text-dark" for="isFeatured">Featured Attraction</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="isActive" name="is_active" {% if destination.is_active %}checked{% endif %}>
              <label class="form-check-label small fw-semibold text-dark" for="isActive">Publicly Visible</label>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 pt-3 border-top">
            <a href="{{ url_for('admin.destinations') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-teal rounded-pill px-5 fw-semibold shadow-sm">
              Save Changes
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
