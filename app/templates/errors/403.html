{% extends "base.html" %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 text-orange fw-bold mb-3"><i class="bi bi-shield-lock"></i> 403</div>
    <h2 class="fw-bold text-navy mb-3">Restricted Access</h2>
    <p class="text-muted lead max-w-lg mx-auto mb-4">
      You do not have administrative or organizer permissions to view this resource.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-teal rounded-pill px-4 py-2">
      <i class="bi bi-house-door me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
