{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 text-teal fw-bold mb-3"><i class="bi bi-compass"></i> 404</div>
    <h2 class="fw-bold text-navy mb-3">Destination Not Found</h2>
    <p class="text-muted lead max-w-lg mx-auto mb-4">
      The attraction, event, or page you are exploring does not exist or may have been relocated.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-teal rounded-pill px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Back to Homepage
      </a>
      <a href="{{ url_for('main.destinations') }}" class="btn btn-outline-teal rounded-pill px-4 py-2">
        <i class="bi bi-search me-1"></i> Explore Destinations
      </a>
    </div>
  </div>
</div>
{% endblock %}
