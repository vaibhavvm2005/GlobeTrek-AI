{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-exclamation-octagon"></i> 500</div>
    <h2 class="fw-bold text-navy mb-3">Internal System Error</h2>
    <p class="text-muted lead max-w-lg mx-auto mb-4">
      An unexpected condition occurred on the booking server. Our technical team has been logged of this event.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-teal rounded-pill px-4 py-2">
      <i class="bi bi-house-door me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
