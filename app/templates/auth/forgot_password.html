{% extends "base.html" %}
{% block title %}Reset Password – GlobeTrek AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        
        <div class="display-6 mb-2">🔑</div>
        <h3 class="fw-bold text-navy mb-2">Forgot Password</h3>
        <p class="text-muted small mb-4">Enter your registered email address and we'll send you an encrypted password recovery link.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-4 text-start">
            <label class="form-label small fw-semibold text-dark">Account Email</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
          </div>

          <button type="submit" class="btn btn-teal w-100 py-2.5 rounded-pill fw-semibold shadow-sm mb-3">
            Send Reset Instructions
          </button>
        </form>

        <a href="{{ url_for('auth.login') }}" class="small text-teal text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Back to Sign In
        </a>

      </div>
    </div>
  </div>
</div>
{% endblock %}
