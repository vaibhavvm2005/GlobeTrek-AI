{% extends "base.html" %}
{% block title %}Sign In – GlobeTrek AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        
        <div class="text-center mb-4">
          <div class="display-6 mb-2">🌍</div>
          <h3 class="fw-bold text-navy">Welcome Back</h3>
          <p class="text-muted small">Sign in to your GlobeTrek AI travel account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label small fw-semibold text-dark">Email or Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="text" id="loginIdInput" name="login_id" class="form-control border-start-0" placeholder="e.g. customer@demo.com" value="{{ login_id }}" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label small fw-semibold text-dark">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-teal text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
              <input type="password" id="passwordInput" name="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label small text-muted" for="remember">Keep me logged in on this browser</label>
          </div>

          <button type="submit" class="btn btn-teal w-100 py-2.5 rounded-pill fw-semibold shadow-sm mb-3">
            Sign In to Account
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
          <p class="small text-muted mb-0">Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="text-teal fw-semibold text-decoration-none">Create Account</a>
          </p>
        </div>

        <!-- 1-Click Demo Accounts -->
        <div class="mt-4 p-3 bg-light rounded-3 border border-secondary-subtle">
          <small class="text-dark fw-bold d-block mb-2 text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">
            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins:
          </small>
          <div class="d-flex flex-column gap-1.5">
            <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2 demo-btn d-flex justify-content-between align-items-center"
                    onclick="fillCreds('customer@demo.com', 'demo123')">
              <span><i class="bi bi-person me-1"></i> Customer Traveler</span>
              <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">customer@demo.com</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2 demo-btn d-flex justify-content-between align-items-center"
                    onclick="fillCreds('organizer@demo.com', 'demo123')">
              <span><i class="bi bi-calendar-check me-1"></i> Event Organizer</span>
              <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">organizer@demo.com</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2 demo-btn d-flex justify-content-between align-items-center"
                    onclick="fillCreds('admin@demo.com', 'admin123')">
              <span><i class="bi bi-shield-check me-1"></i> Administrator</span>
              <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">admin@demo.com</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
function fillCreds(login, pass) {
  document.getElementById('loginIdInput').value = login;
  document.getElementById('passwordInput').value = pass;
}
</script>
{% endblock %}
