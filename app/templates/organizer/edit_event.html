{% extends "base.html" %}
{% block title %}Edit Event – {{ event.title }}{% endblock %}

{% block content %}
<div class="bg-navy text-white py-4 mb-4">
  <div class="container">
    <h2 class="fw-bold font-serif mb-1">Edit Event Details</h2>
    <p class="text-white-50 small mb-0">{{ event.title }}</p>
  </div>
</div>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mb-4">
        <form method="POST" action="{{ url_for('organizer.edit_event', id=event.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <h5 class="fw-bold text-navy font-serif mb-3">Event Information</h5>
          <div class="row g-3 mb-4">
            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Event Title</label>
              <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">Category</label>
              <select name="category_id" class="form-select" required>
                {% for c in categories %}
                  <option value="{{ c.id }}" {% if event.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">Promotional Image URL</label>
              <input type="url" name="image" class="form-control" value="{{ event.image }}">
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-dark">Event Description</label>
              <textarea name="description" class="form-control" rows="4" required>{{ event.description }}</textarea>
            </div>
          </div>

          <h5 class="fw-bold text-navy font-serif mb-3">Schedule &amp; Venue</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Date</label>
              <input type="date" name="event_date" class="form-control" value="{{ event.event_date.strftime('%Y-%m-%d') if event.event_date else '' }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">Start Time</label>
              <input type="time" name="start_time" class="form-control" value="{{ event.start_time }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold text-dark">End Time</label>
              <input type="time" name="end_time" class="form-control" value="{{ event.end_time }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">Venue Name / Arena</label>
              <input type="text" name="venue_name" class="form-control" value="{{ event.venue_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">Venue Address</label>
              <input type="text" name="venue_address" class="form-control" value="{{ event.venue_address }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">City</label>
              <input type="text" name="city" class="form-control" value="{{ event.city }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-dark">Country</label>
              <input type="text" name="country" class="form-control" value="{{ event.country }}" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-dark">Cancellation Policy</label>
            <textarea name="cancellation_policy" class="form-control" rows="2">{{ event.cancellation_policy }}</textarea>
          </div>

          <div class="d-flex justify-content-end gap-3 pt-3 border-top">
            <a href="{{ url_for('organizer.events') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-teal rounded-pill px-5 fw-semibold shadow-sm">
              Save Updates
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
